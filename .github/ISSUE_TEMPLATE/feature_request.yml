name: Feature request
description: Suggest an idea or an improvement for the firmware, the service, the application or the hardware.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for the suggestion. Please check the existing issues first.

  - type: dropdown
    id: component
    attributes:
      label: Component
      multiple: true
      options:
        - Firmware
        - Service
        - Application (UI)
        - Hardware
        - Not sure

  - type: textarea
    id: problem
    attributes:
      label: What problem would it solve?
      description: Describe the situation or use case.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How should it work?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered

  - type: textarea
    id: additional
    attributes:
      label: Additional information
      description: Mockups, screenshots, links.
